services:
  portfolio-lab:
    build: .
    ports:
      - "${AQ_BIND_PORT:-8000}:8000"
    environment:
      AQ_PORTFOLIO_DB_PATH: /app/runtime/portfolio.sqlite3
      AQ_ENV: production
      AQ_AUTH_REQUIRED: "true"
      AQ_ALLOW_REGISTRATION: ${AQ_ALLOW_REGISTRATION:-true}
      AQ_AUTH_SECRET: ${AQ_AUTH_SECRET:?AQ_AUTH_SECRET must be set}
      AQ_AUTH_TOKEN_TTL_SECONDS: ${AQ_AUTH_TOKEN_TTL_SECONDS:-28800}
      AQ_RATE_LIMIT_PER_MINUTE: ${AQ_RATE_LIMIT_PER_MINUTE:-120}
      AQ_MAX_REQUEST_BYTES: ${AQ_MAX_REQUEST_BYTES:-1048576}
      AQ_CORS_ORIGINS: ${AQ_CORS_ORIGINS:-http://127.0.0.1:8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - portfolio-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  portfolio-runtime:
