services:
  portfolio-lab:
    build: .
    ports:
      - "8000:8000"
    environment:
      AQ_PORTFOLIO_DB_PATH: /app/runtime/portfolio_demo.sqlite3
      AQ_ENV: ${AQ_ENV:-development}
      AQ_AUTH_REQUIRED: ${AQ_AUTH_REQUIRED:-false}
      AQ_ALLOW_REGISTRATION: ${AQ_ALLOW_REGISTRATION:-true}
      AQ_AUTH_SECRET: ${AQ_AUTH_SECRET:-development-only-change-me-before-production}
      AQ_CORS_ORIGINS: ${AQ_CORS_ORIGINS:-http://127.0.0.1:8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
